---
bcr_test_module:
  # Relative to the module root after `strip_prefix`. The tests are a module
  # of their own, so that `@rules_helm_img//...` does not load them.
  module_path: "tests"
  matrix:
    # rules_img has not been exercised on windows. See `tests/BUILD.bazel`.
    platform: ["macos_arm64", "ubuntu2404"]
    bazel: ["7.x", "8.x", "9.x"]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "--"
        - "//..."
