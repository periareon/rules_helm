---
bcr_test_module:
  # Relative to the module root after `strip_prefix`, so the module is
  # its own test module. `release_prep.sh` ignores the `tests` package in the
  # archive, so it only builds here. The tests run in CI.
  module_path: "."
  matrix:
    # rules_img has not been exercised on windows. See `tests/BUILD.bazel`.
    platform: ["macos_arm64", "ubuntu2404"]
    bazel: ["7.x", "8.x", "9.x"]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "--"
        - "//..."
